' letter-spacing='1.9'>05 · ACCESS</text><rect x='1094.0' y='188.0' width='226.0' height='232.0' rx='3' fill='#161F27' fill-opacity='1.0' stroke='#27333C' stroke-width='1'/><rect x='1118.5' y='216.0' width='19' height='13' rx='2' fill='none' fill-opacity='1.0' stroke='#54BFB2' stroke-width='1'/><line x1='1128.0' y1='229.0' x2='1128.0' y2='232.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><line x1='1124.0' y1='232.0' x2='1132.0' y2='232.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><line x1='1122.5' y1='220.0' x2='1129.0' y2='220.0' stroke='#54BFB2' stroke-width='1.4' stroke-linecap='round'/><line x1='1122.5' y1='223.5' x2='1127.0' y2='223.5' stroke='#54BFB2' stroke-width='1.4' stroke-linecap='round'/><text x='1116.0' y='272.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='16.5' font-weight='680' fill='#EAF0F2' text-anchor='start' letter-spacing='-0.2'>An investment account</text><text x='1116.0' y='298.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>A fund platform, or a broker</text><text x='1116.0' y='317.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>together with a demat.</text><rect x='1116.0' y='376.0' width='50.0' height='22' rx='2' fill='#122B2A' fill-opacity='1.0' stroke='#255049' stroke-width='1'/><text x='1126.0' y='391.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='650' fill='#54BFB2' text-anchor='start' letter-spacing='0.2'>₹ INR</text><text x='1352.0' y='172.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#D2A567' text-anchor='start' letter-spacing='1.9'>06 · HOLD</text><rect x='1352.0' y='188.0' width='226.0' height='232.0' rx='3' fill='#161F27' fill-opacity='1.0' stroke='#27333C' stroke-width='1'/><line x1='1376.0' y1='233.0' x2='1396.0' y2='233.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><line x1='1379.0' y1='233.0' x2='1379.0' y2='226.0' stroke='#54BFB2' stroke-width='2.2' stroke-linecap='round'/><line x1='1384.0' y1='233.0' x2='1384.0' y2='221.0' stroke='#54BFB2' stroke-width='2.2' stroke-linecap='round'/><line x1='1389.0' y1='233.0' x2='1389.0' y2='223.5' stroke='#54BFB2' stroke-width='2.2' stroke-linecap='round'/><line x1='1394.0' y1='233.0' x2='1394.0' y2='216.0' stroke='#54BFB2' stroke-width='2.2' stroke-linecap='round'/><text x='1374.0' y='272.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='16.5' font-weight='680' fill='#EAF0F2' text-anchor='start' letter-spacing='-0.2'>Your portfolio</text><text x='1374.0' y='298.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>Funds, shares, or whatever</text><text x='1374.0' y='317.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>else you chose to hold.</text><rect x='1374.0' y='376.0' width='50.0' height='22' rx='2' fill='#122B2A' fill-opacity='1.0' stroke='#255049' stroke-width='1'/><text x='1384.0' y='391.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='650' fill='#54BFB2' text-anchor='start' letter-spacing='0.2'>₹ INR</text><line x1='62' y1='496.0' x2='1578' y2='496.0' stroke='#27333C' stroke-width='1.0' stroke-linecap='round'/><text x='62' y='522.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#D2A567' text-anchor='start' letter-spacing='1.9'>WHAT HAS TO BE TRUE BEFORE THE STEP WORKS</text><text x='62.0' y='552.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='650' fill='#C2CFD6' text-anchor='start'>Nothing</text><text x='62.0' y='573.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>No paperwork gates this step.</text><text x='320.0' y='552.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='650' fill='#C2CFD6' text-anchor='start'>A local account</text><text x='320.0' y='573.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>Opened where you live.</text><text x='578.0' y='552.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='650' fill='#C2CFD6' text-anchor='start'>Proof of source</text><text x='578.0' y='573.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>The channel will ask where</text><text x='578.0' y='591.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>the money came from.</text><text x='836.0' y='552.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='650' fill='#C2CFD6' text-anchor='start'>Your status, declared</text><text x='836.0' y='573.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>The bank has to be told it</text><text x='836.0' y='591.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>changed. That duty is yours.</text><text x='1094.0' y='552.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='650' fill='#C2CFD6' text-anchor='start'>KYC, done again</text><text x='1094.0' y='573.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>PAN, plus KYC redone under</text><text x='1094.0' y='591.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>your new status.</text><text x='1352.0' y='552.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='13' font-weight='650' fill='#C2CFD6' text-anchor='start'>Nothing further</text><text x='1352.0' y='573.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11.5' font-weight='400' fill='#75868F' text-anchor='start'>Holding is the easy part.</text><line x1='62' y1='616.0' x2='1578' y2='616.0' stroke='#27333C' stroke-width='1.0' stroke-linecap='round'/><text x='62' y='642.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#D2A567' text-anchor='start' letter-spacing='1.9'>READ THIS AS A SHAPE, NOT AS A RULEBOOK</text><text x='62' y='664.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>Eligibility, limits and the paperwork each institution asks for are revised, sometimes yearly. Confirm anything you are about to act on with the institution itself.</text></svg>