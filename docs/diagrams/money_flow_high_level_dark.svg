xt><text x='84.0' y='298.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>Salary or business income,</text><text x='84.0' y='317.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>paid in the local currency.</text><rect x='84.0' y='376.0' width='104.0' height='22' rx='2' fill='#122B2A' fill-opacity='1.0' stroke='#255049' stroke-width='1'/><text x='94.0' y='391.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='650' fill='#54BFB2' text-anchor='start' letter-spacing='0.2'>local currency</text><text x='320.0' y='172.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#D2A567' text-anchor='start' letter-spacing='1.9'>02 · RECEIVE</text><rect x='320.0' y='188.0' width='226.0' height='232.0' rx='3' fill='#161F27' fill-opacity='1.0' stroke='#27333C' stroke-width='1'/><path d='M344.0 221.0 L354.0 215.0 L364.0 221.0' fill='none' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><line x1='344.0' y1='233.0' x2='364.0' y2='233.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><line x1='347.5' y1='223.0' x2='347.5' y2='230.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><line x1='354.0' y1='223.0' x2='354.0' y2='230.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><line x1='360.5' y1='223.0' x2='360.5' y2='230.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><text x='342.0' y='272.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='16.5' font-weight='680' fill='#EAF0F2' text-anchor='start' letter-spacing='-0.2'>Your bank abroad</text><text x='342.0' y='298.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>It lands in the ordinary</text><text x='342.0' y='317.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>account you already use.</text><rect x='342.0' y='376.0' width='104.0' height='22' rx='2' fill='#122B2A' fill-opacity='1.0' stroke='#255049' stroke-width='1'/><text x='352.0' y='391.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='11' font-weight='650' fill='#54BFB2' text-anchor='start' letter-spacing='0.2'>local currency</text><text x='578.0' y='172.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#D2A567' text-anchor='start' letter-spacing='1.9'>03 · CROSS</text><rect x='578.0' y='188.0' width='226.0' height='232.0' rx='3' fill='#161F27' fill-opacity='1.0' stroke='#27333C' stroke-width='1'/><circle cx='612.0' cy='224.0' r='9' fill='none' stroke='#54BFB2' stroke-width='1.6'/><ellipse cx='612.0' cy='224.0' rx='4.2' ry='9' fill='none' stroke='#54BFB2' stroke-width='1.6'/><line x1='603.0' y1='224.0' x2='621.0' y2='224.0' stroke='#54BFB2' stroke-width='1.6' stroke-linecap='round'/><text x='600.0' y='272.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='16.5' font-weight='680' fill='#EAF0F2' text-anchor='start' letter-spacing='-0.2'>Send it to India</text><text x='600.0' y='298.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>A regulated channel converts</text><text x='600.0' y='317.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='12.5' font-weight='400' fill='#93A4AE' text-anchor='start'>it and carries it across.</text><rect x='600.0' y='376.0' width='104.0' height='22' rx='2' fill='#2A2216' fill-opacity='1.0' stroke='#4A3B22' stroke-width='1'/><text x