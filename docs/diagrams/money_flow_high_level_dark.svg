<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1640 700' width='100%' role='img' preserveAspectRatio='xMidYMid meet'><rect x='0' y='0' width='1640' height='700' rx='0' fill='#0D141A' fill-opacity='1.0' stroke='none' stroke-width='1'/><text x='62' y='62' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='31' font-weight='700' fill='#EAF0F2' text-anchor='start' letter-spacing='-0.6'>How the money moves</text><text x='62' y='93' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='15' font-weight='400' fill='#93A4AE' text-anchor='start'>Six steps, one border, one change of currency. No provider names: implementation examples come later.</text><rect x='40' y='112.0' width='516.0' height='332.0' rx='2' fill='#111A21' fill-opacity='0.75' stroke='none' stroke-width='1'/><text x='56' y='136.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#93A4AE' text-anchor='start' letter-spacing='1.9'>OUTSIDE INDIA</text><rect x='556.0' y='112.0' width='270.0' height='332.0' rx='2' fill='#2A2216' fill-opacity='0.75' stroke='none' stroke-width='1'/><text x='572.0' y='136.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#D2A567' text-anchor='start' letter-spacing='1.9'>THE CROSSING</text><rect x='826.0' y='112.0' width='774.0' height='332.0' rx='2' fill='#122B2A' fill-opacity='0.75' stroke='none' stroke-width='1'/><text x='842.0' y='136.0' font-family="ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size='10.5' font-weight='700' fill='#54BFB2' text-anchor='start' letter-spacing='1.9'>INSIDE INDIA</text><line x1='556.0' y1='112.0' x2='556.0' y2='444.0' stroke='#4A3B22' stroke-width='1.4' stroke-linecap='round' stroke-dasharray='5 5'/><line x1='826.0' y1='112.0' x2='826.0' y2='444.0' stroke='#4A3B22' stroke-width='1.4' stroke-linecap='round' stroke-dasharray='5 5'/><text x